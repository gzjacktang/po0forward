name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: make test
      - run: make linux
      - name: Linux forwarding integration
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 python3
          sudo bash tests/netns.sh "$PWD/bin/agent-linux-amd64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: bin/*-linux-*
          if-no-files-found: error
